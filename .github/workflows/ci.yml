name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Tests/WireAndRifles.Tests/WireAndRifles.Tests.csproj

      - name: Build
        run: >
          dotnet build Tests/WireAndRifles.Tests/WireAndRifles.Tests.csproj
          --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test Tests/WireAndRifles.Tests/WireAndRifles.Tests.csproj
          --no-build --configuration Release --verbosity normal
